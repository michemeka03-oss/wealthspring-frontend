<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin — Wealthspring</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-6 font-mono"><h1 class="text-[24px] font-bold">Admin Panel — Jeffry Only</h1><p class="text-[12px] text-white/50">This page calls backend /api/admin/deposits to approve. Share with no one.</p><input id="adminEmail" placeholder="Your admin email" value="Jeffryhart96@gmail.com" class="mt-6 w-full p-3 rounded-full bg-white/10"><input id="adminPass" type="password" placeholder="Admin password (set in backend)" class="mt-3 w-full p-3 rounded-full bg-white/10"><button onclick="load()" class="mt-4 px-6 py-3 bg-white text-black rounded-full font-bold">Load Pending</button><div id="list" class="mt-6 space-y-3"></div>
<script>
const API='https://wealthspring-backend.onrender.com';
async function load(){ const email=document.getElementById('adminEmail').value, pass=document.getElementById('adminPass').value; try{ const r=await fetch(API+'/api/admin/deposits?adminEmail='+encodeURIComponent(email)+'&adminPass='+encodeURIComponent(pass)); const d=await r.json(); document.getElementById('list').innerHTML=d.map(x=>`<div class="bg-white/10 p-4 rounded-xl flex justify-between"><div><div>${x.email} — $${x.amount}</div><div class="text-[11px] text-white/40">${x.txId} — ${x.date}</div></div><button onclick="approve('${x._id||x.txId}','${x.email}',${x.amount})" class="px-4 py-2 bg-green-400 text-black rounded-full font-bold">Approve</button></div>`).join(''); }catch(e){ alert('Failed — check backend'); } }
async function approve(id,email,amount){ if(!confirm('Approve $'+amount+' for '+email+'?')) return; const adminEmail=document.getElementById('adminEmail').value, adminPass=document.getElementById('adminPass').value; try{ await fetch(API+'/api/admin/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,email,amount,adminEmail,adminPass})}); alert('Approved — balance updated'); load(); }catch{ alert('Failed'); } }
</script></body></html>
