<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Log in — Wealthspring</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Manrope;background:#070A14;color:white}</style></head>
<body>
<header class="px-6 md:px-10 py-5 flex justify-between items-center border-b border-white/10"><a href="index.html" class="flex items-center gap-2 font-extrabold text-[18px]"><div class="w-8 h-8 bg-white text-black rounded-full flex items-center justify-center">W</div>Wealthspring</a><a href="register.html" class="px-6 py-2.5 bg-white text-black rounded-full text-[13px] font-bold">Get Started</a></header>
<div class="max-w-[420px] mx-auto px-6 py-16 md:py-24"><div class="bg-white/5 border border-white/10 rounded-[24px] p-8 backdrop-blur"><h2 class="text-[28px] font-extrabold">Welcome back</h2><p class="text-[13px] text-white/50 mt-2">Log in to your wealth account</p><input id="email" placeholder="Email address" class="mt-6 w-full bg-white/5 border border-white/10 p-4 rounded-full outline-none"><input id="password" type="password" placeholder="Password" class="mt-3 w-full bg-white/5 border border-white/10 p-4 rounded-full outline-none"><button onclick="handleLogin()" class="mt-6 w-full py-4 bg-white text-black rounded-full font-bold">Log in</button><p class="text-[13px] text-center mt-5 text-white/50">No account? <a href="register.html" class="text-white font-bold underline">Create account</a></p><p id="authMsg" class="text-[12px] mt-4 text-center"></p></div></div>
<script>
const API='https://wealthspring-backend.onrender.com';
async function handleLogin(){
 const e=document.getElementById('email').value.trim().toLowerCase(), p=document.getElementById('password').value.trim(), m=document.getElementById('authMsg');
 if(!e||!p){ m.style.color='#ff6b6b'; m.innerText='Fill all'; return; }
 m.style.color='white'; m.innerText='Processing...';
 try{
  const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
  const d=await r.json();
  if(d.ok){ localStorage.setItem('ws_email',e); window.location.href='dashboard.html'; }
  else{ m.style.color='#ff6b6b'; m.innerText=d.error==='invalid'?'Invalid email or password':(d.error||'Login failed'); }
 }catch{ m.style.color='#ff6b6b'; m.innerText='Could not connect, retry...'; }
}
</script>
</body></html>
