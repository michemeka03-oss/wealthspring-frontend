<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — Wealthspring</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Manrope;background:#070A14;color:white}.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px)}.tab-active{background:white;color:black!important}</style>
</head><body>
<header class="px-6 md:px-10 py-5 flex justify-between items-center border-b border-white/10 sticky top-0 bg-[#070A14] z-50">
<div class="flex items-center gap-2 font-extrabold text-[18px]"><div class="w-8 h-8 bg-white text-black rounded-full flex items-center justify-center">W</div>Wealthspring</div>
<div class="flex items-center gap-3"><div id="userName" class="text-[13px] text-white/60"></div><button onclick="logout()" class="px-4 py-2 bg-white/10 rounded-full text-[12px]">Log out</button></div></header>
<div class="max-w-[1100px] mx-auto px-6">
<div class="mt-6 flex gap-2 overflow-auto pb-2">
<button onclick="switchTab('overview')" id="t-overview" class="tab-active px-5 py-2.5 rounded-full text-[13px] font-bold border border-white/10">Overview</button>
<button onclick="switchTab('how')" id="t-how" class="px-5 py-2.5 rounded-full text-[13px] bg-white/5 border border-white/10">How It Works</button>
<button onclick="switchTab('faq')" id="t-faq" class="px-5 py-2.5 rounded-full text-[13px] bg-white/5 border border-white/10">FAQ</button>
<button onclick="switchTab('support')" id="t-support" class="px-5 py-2.5 rounded-full text-[13px] bg-white/5 border border-white/10">Support • Live</button>
</div>
<div id="tab-overview" class="py-8">
<div class="grid md:grid-cols-3 gap-6">
<div class="md:col-span-2 bg-white text-black rounded-[20px] p-8">
<div class="text-[11px] text-black/50 uppercase tracking-widest">Available Balance</div>
<div id="balDisplay" class="text-[44px] font-extrabold mt-2">$0.00</div>
<div id="dashEmail" class="text-[12px] text-black/50 mt-1"></div>
<div class="mt-6 flex gap-3"><button onclick="openDeposit(100)" class="px-6 py-3 bg-black text-white rounded-full font-bold text-[13px]">Deposit</button><button onclick="openWithdraw()" class="px-6 py-3 bg-black/5 border rounded-full text-[13px]">Withdraw</button></div>
</div>
<div class="glass rounded-[20px] p-6"><div class="text-[11px] text-white/40 uppercase">Calculator — 7 Days</div>
<input id="calcAmt" type="number" value="500" oninput="doCalc()" class="mt-4 w-full bg-white/5 border border-white/10 p-3.5 rounded-full text-white">
<div id="calcOut" class="mt-4 space-y-2 text-[13px]"></div></div></div>
<div class="mt-8"><h3 class="font-bold">Investment Plans — 7 Day Cycles</h3>
<div class="mt-4 grid md:grid-cols-4 gap-4">
<div class="glass rounded-[16px] p-6"><div class="text-[11px] text-white/40">BRONZE 100-499</div><div class="font-bold text-[18px] mt-1">10% in 7 Days</div><button onclick="openDeposit(100)" class="mt-4 w-full py-2.5 bg-white text-black rounded-full font-bold text-[12px]">Invest $100</button></div>
<div class="glass rounded-[16px] p-6"><div class="text-[11px] text-white/40">SILVER 499-1999</div><div class="font-bold text-[18px] mt-1">15% in 7 Days</div><button onclick="openDeposit(500)" class="mt-4 w-full py-2.5 bg-white text-black rounded-full font-bold text-[12px]">Invest $500
