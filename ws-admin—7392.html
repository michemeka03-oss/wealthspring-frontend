<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin — Wealthspring</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-6 font-mono">
<h1 class="text-[20px] font-bold">Admin — Pending Deposits</h1>
<p class="text-[11px] text-white/40 mt-1">Keep this URL private. Do not share.</p>
<input id="adminEmail" placeholder="Admin email" class="mt-6 w-full p-3 rounded-full bg-white/10 outline-none">
<input id="adminPass" type="password" placeholder="Admin password" class="mt-3 w-full p-3 rounded-full bg-white/10 outline-none">
<button onclick="load()" class="mt-4 px-6 py-3 bg-white text-black rounded-full font-bold text-[13px]">Load Pending</button>
<div id="list" class="mt-6 space-y-3 text-[13px]"></div>
<script>
const API='https://wealthspring-backend.onrender.com';
async function load(){
 const email=document.getElementById('adminEmail').value.trim();
 const pass=document.getElementById('adminPass').value.trim();
 if(!email||!pass) return alert('Enter admin login');
 try{
  const r=await fetch(API+'/api/admin/deposits?adminEmail='+encodeURIComponent(email)+'&adminPass='+encodeURIComponent(pass));
  const d=await r.json();
  if(!Array.isArray(d)){ return document.getElementById('list').innerHTML='<div class="text-red-400">'+(d.msg||'Failed')+'</div>'; }
  if(d.length===0){ document.getElementById('list').innerHTML='<div class="text-white/40">No pending</div>'; return; }
  document.getElementById('list').innerHTML=d.map(x=>`<div class="bg-white/10 p-4 rounded-xl flex justify-between items-center"><div><div>${x.email} — $${x.amount}</div><div class="text-[10px] text-white/40 break-all">${x.txId} — ${new Date(x.date).toLocaleString()}</div></div><button onclick="approve('${x._id||x.txId}','${x.email}',${x.amount})" class="px-4 py-2 bg-[#C8FF00] text-black rounded-full font-bold">Approve</button></div>`).join('');
 }catch(e){ alert('Backend not reachable'); }
}
async function approve(id,email,amount){
 if(!confirm('Approve $'+amount+' for '+email+'?')) return;
 const adminEmail=document.getElementById('adminEmail').value.trim();
 const adminPass=document.getElementById('adminPass').value.trim();
 try{
  const r=await fetch(API+'/api/admin/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,email,amount,adminEmail,adminPass})});
  const j=await r.json();
  if(r.ok){ alert('Approved'); load(); } else alert(j.msg||'Failed');
 }catch{ alert('Failed'); }
}
</script></body></html>
