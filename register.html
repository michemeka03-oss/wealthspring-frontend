<script>
const API='https://wealthspring-backend.onrender.com';
async function handleRegister(){
 const e=document.getElementById('regEmail').value.trim().toLowerCase(), p=document.getElementById('regPassword').value.trim(), c=document.getElementById('regConfirm').value.trim(), ag=document.getElementById('agree').checked, m=document.getElementById('regMsg');
 if(!e||!p||!c){ m.style.color='#ff6b6b'; m.innerText='Fill all fields'; return; }
 if(p.length<6){ m.style.color='#ff6b6b'; m.innerText='Password min 6'; return; }
 if(p!==c){ m.style.color='#ff6b6b'; m.innerText='Passwords do not match'; return; }
 if(!ag){ m.style.color='#ff6b6b'; m.innerText='You must agree'; return; }
 m.style.color='white'; m.innerText='Creating account...';
 try{ 
  const r=await fetch(API+'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})}); 
  const d=await r.json(); 
  if(d.ok){ 
    localStorage.setItem('ws_email',e); 
    m.style.color='#C8FF00'; m.innerText='Account created! Loading dashboard...'; 
    setTimeout(()=>window.location.href='dashboard.html',800); 
  }else{ 
    m.style.color='#ff6b6b'; m.innerText=d.error==='exists'?'Email already exists — log in instead':(d.error||'Failed'); 
  } 
 }catch(err){ 
  m.style.color='#ff6b6b'; m.innerText='Could not connect, retry...'; 
 }
}
</script>
