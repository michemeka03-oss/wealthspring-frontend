<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account — Wealthspring</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Manrope;background:#070A14;color:white}</style></head>
<body>
<header class="px-6 md:px-10 py-5 flex justify-between items-center border-b border-white/10"><a href="index.html" class="flex items-center gap-2 font-extrabold text-[18px]"><div class="w-8 h-8 bg-white text-black rounded-full flex items-center justify-center">W</div>Wealthspring</a><a href="login.html" class="text-[13px] text-white/70">Log in</a></header>
<div class="max-w-[420px] mx-auto px-6 py-16 md:py-24"><div class="bg-white/5 border border-white/10 rounded-[24px] p-8 backdrop-blur"><h2 class="text-[28px] font-extrabold">Create account</h2><p class="text-[13px] text-white/50 mt-2">Start your private wealth journey</p><input id="regEmail" placeholder="Email address" class="mt-6 w-full bg-white/5 border border-white/10 p-4 rounded-full outline-none"><input id="regPassword" type="password" placeholder="Password (min 6 characters)" class="mt-3 w-full bg-white/5 border border-white/10 p-4 rounded-full outline-none"><input id="regConfirm" type="password" placeholder="Repeat password" class="mt-3 w-full bg-white/5 border border-white/10 p-4 rounded-full outline-none"><div class="mt-4 flex gap-2 items-start"><input type="checkbox" id="agree" class="mt-1"><label for="agree" class="text-[11px] text-white/50">I agree to Terms & Privacy and confirm I am 18+</label></div><button onclick="handleRegister()" class="mt-6 w-full py-4 bg-white text-black rounded-full font-bold">Create Account</button><p class="text-[13px] text-center mt-5 text-white/50">Already have account? <a href="login.html" class="text-white font-bold underline">Log in</a></p><p id="regMsg" class="text-[12px] mt-4 text-center"></p></div></div>
<script>
const API='https://wealthspring-backend.onrender.com';
async function handleRegister(){
 const e=document.getElementById('regEmail').value.trim(), p=document.getElementById('regPassword').value.trim(), c=document.getElementById('regConfirm').value.trim(), ag=document.getElementById('agree').checked, m=document.getElementById('regMsg');
 if(!e||!p||!c){ m.style.color='#ff6b6b'; m.innerText='Fill all fields'; return; }
 if(p.length<6){ m.style.color='#ff6b6b'; m.innerText='Password min 6'; return; }
 if(p!==c){ m.style.color='#ff6b6b'; m.innerText='Passwords do not match'; return; }
 if(!ag){ m.style.color='#ff6b6b'; m.innerText='You must agree'; return; }
 m.style.color='white'; m.innerText='Creating account...';
 try{ const r=await fetch(API+'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})}); const d=await r.json(); if(r.ok){ localStorage.setItem('ws_email',e); localStorage.setItem('ws_tx_'+e,JSON.stringify([])); m.style.color='#C8FF00'; m.innerText='Account created! Loading dashboard...'; setTimeout(()=>window.location.href='dashboard.html',1000); }else{ m.style.color='#ff6b6b'; m.innerText=d.message||'Email already exists'; } }catch{ m.style.color='#ff6b6b'; m.innerText='Backend waking, retry in 20s'; }
}
</script>
</body></html>
